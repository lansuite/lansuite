name: Auto-label merge conflicts

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  conflicts:
    runs-on: ubuntu-24.04

    steps:
      - uses: mschilde/auto-label-merge-conflicts@3fdaf1c8b3f8e5b0f88753d9cb3c9c779370b3ef
        with:
          CONFLICT_LABEL_NAME: conflicts
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
